<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script src="authcap.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pencil Notes</title>
<meta name="description" content="Handwritten notes with tasks and reminders">
<meta name="theme-color" content="#111114">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||(t==="system"&&!matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="light";}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pencil Notes">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="Notebooks">
    <div class="side-head">
      <div class="brand"><img src="icons/icon-192.png" alt=""><span>Pencil Notes</span></div>
      <button class="icon-btn only-narrow" id="closeSidebar" aria-label="Close sidebar">✕</button>
    </div>
    <input id="search" type="search" placeholder="Search notes & handwriting labels" autocomplete="off">
    <p id="searchHint" class="fine" hidden></p>
    <div id="notebookList"></div>
    <div class="side-actions">
      <button class="btn primary" id="newNote">＋ New note</button>
      <button class="btn" id="newNotebook">＋ Notebook</button>
    </div>
    <div class="side-foot">
      <button class="btn small" id="exportBtn">⬇︎ Export backup</button>
      <button class="btn small" id="importBtn">⬆︎ Import</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <input type="file" id="pdfFile" accept="application/pdf,.pdf" hidden>
      <input type="file" id="photoFile" accept="image/*" hidden>
    </div>
  </aside>
  <div id="scrim"></div>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn" id="toggleSidebar" aria-label="Notes">☰</button>
      <input id="noteTitle" aria-label="Note title" placeholder="Untitled">
      <div class="spacer"></div>
      <button class="icon-btn" id="recBtn" aria-label="Record" title="Record a meeting">🎙</button>
      <button class="icon-btn" id="undoBtn" aria-label="Undo" title="Undo">↶</button>
      <button class="icon-btn" id="redoBtn" aria-label="Redo" title="Redo">↷</button>
      <button class="icon-btn" id="todayBtn" aria-label="Today" title="Today">☀️</button>
      <button class="icon-btn" id="focusBtn" aria-label="Full screen" title="Full screen writing">⤢</button>
      <button class="icon-btn" id="noteMenuBtn" aria-label="Note options" title="Note options">⋯</button>
      <button class="icon-btn" id="quotesBtn" aria-label="Boards" title="Boards — Quote Board, Idea Board &amp; Inbox">📋</button>
      <button class="icon-btn" id="togglePanel" aria-label="Reminders" title="Reminders &amp; tasks">🔔<span id="dueBadge" class="badge" hidden></span></button>
    </header>

    <div id="toolbar" role="toolbar">
      <div class="group tools">
        <button class="tool" data-tool="pen" title="Pen">✒️<span>Pen</span></button>
        <button class="tool" data-tool="highlighter" title="Highlighter">🖍️<span>Highlight</span></button>
        <button class="tool" data-tool="eraser" title="Eraser">🧽<span>Erase</span></button>
        <button class="tool" data-tool="lasso" title="Lasso: circle handwriting to turn it into a task">➰<span>Lasso</span></button>
        <button class="tool" data-tool="text" title="Text box">🔤<span>Text</span></button>
        <button class="tool task-tool" data-tool="task" title="Tap the page to drop a task checkbox">☑️<span>Task</span></button>
        <button class="tool num-tool" data-tool="section" title="Numbered sections: tap the start of a line to add 1. 2. 3. — drag a number to move its whole section">
          <b class="num-ic">1.</b><span>Number</span></button>
      </div>
      <div class="group colors" id="colors"></div>
      <div class="group widths" id="widths"></div>
      <div class="group misc">
        <button class="chip-btn" id="photoBtn" title="Insert photo">🖼 Photo</button>
        <button class="chip-btn" id="stickerBtn" title="Insert sticker">⭐ Sticker</button>
        <button class="chip-btn" id="remindNoteBtn" title="Add a reminder to this note">⏰ Remind</button>
        <button class="chip-btn" id="fingerBtn" title="Draw with finger">☝️ Finger</button>
      </div>
    </div>

    <div id="noteReminders"></div>
    <div id="pages" tabindex="-1"><div id="pagesInner"></div></div>
    <button id="zoomChip" hidden title="Reset zoom">100%</button>
    <div id="lassoMenu" class="float-menu" hidden>
      <button id="lassoTask" class="primary">☑️ Make task</button>
      <button id="lassoPlanner">📅 To planner</button>
      <button id="lassoBoard">📋 Send to board</button>
      <button id="lassoAssist">🤖 To assistant</button>
      <button id="lassoRead">🔎 Read handwriting</button>
      <button id="lassoLabel">🏷 Label</button>
      <button id="lassoSection">1. Make section number</button>
      <button id="lassoQuoteForm">💲 Quote form</button>
      <button id="lassoCut">✂️ Cut</button>
      <button id="lassoCopy">⧉ Copy</button>
      <button id="lassoPaste" hidden>📋 Paste</button>
      <button id="lassoDup">⎘ Duplicate</button>
      <button id="lassoDelete">🗑 Delete</button>
      <button id="lassoCancel">✕</button>
    </div>
    <div id="toolHint" hidden></div>
    <div id="focusBar" role="toolbar" aria-label="Full screen tools">
      <button class="tool" data-tool="pen" aria-label="Pen">✒️</button>
      <button class="tool" data-tool="highlighter" aria-label="Highlighter">🖍️</button>
      <button class="tool" data-tool="eraser" aria-label="Eraser">🧽</button>
      <button class="tool" data-tool="lasso" aria-label="Lasso">➰</button>
      <button class="tool task-tool" data-tool="task" aria-label="Task">☑️</button>
      <button class="tool num-tool" data-tool="section" aria-label="Number (numbered sections)" title="Number: tap the start of a line"><b class="num-ic">1.</b></button>
      <button class="icon-btn" data-fa="undo" id="fUndo" aria-label="Undo">↶</button>
      <button class="icon-btn" data-fa="redo" id="fRedo" aria-label="Redo">↷</button>
      <button class="icon-btn" data-fa="exit" aria-label="Exit full screen">⤡</button>
    </div>
  </main>


  <aside id="qbDrawer" aria-label="Boards" hidden>
    <div id="qbResize" role="separator" aria-label="Drag to resize the board panel" title="Drag to resize · double-tap to switch half / full"><i></i></div>
    <header id="qbHead">
      <div class="qb-title"><button id="dbSwitch" class="db-switch" aria-haspopup="listbox" aria-expanded="false" title="Switch board"><b id="dbName"><i>💲</i>Quote Board</b><span class="db-car" aria-hidden="true">▾</span><em id="dbDot" hidden></em></button><small id="qbSync">Email sync off</small></div>
      <div id="dbMenu" role="listbox" aria-label="Choose a board" hidden></div>
      <div class="spacer"></div>
      <button class="qb-btn qb-refresh" id="qbRefresh" aria-label="Refresh — check email for new RFQs"><i>⟳</i><span>Refresh</span></button>
      <button class="qb-btn" id="qbAdd" aria-label="Add a quote"><i>＋</i><span>Quote</span></button>
      <button class="qb-btn icon" id="qbUndo" aria-label="Undo on the Quote Board" disabled>↶</button>
      <button class="qb-btn icon" id="qbRedo" aria-label="Redo on the Quote Board" disabled>↷</button>
      <button class="qb-btn icon" id="qbLock" aria-label="Lock the Quote Board">🔒</button>
      <button class="qb-btn icon" id="qbMore" aria-label="Quote Board options">⋯</button>
      <button class="qb-btn icon" id="qbClose" aria-label="Close the Quote Board">✕</button>
      <div id="qbPull" aria-hidden="true"><span>↓ Pull to check email</span></div>
    </header>
    <div id="qbHost" class="dr-host" data-pi="-1"></div>
    <div id="ibHost" class="dr-host" data-pi="-2" hidden></div>
    <div id="inHost" class="dr-host in-host" hidden></div>
  </aside>
  <button id="qbTab" aria-label="Open Boards — Quote Board, Idea Board &amp; Inbox" title="Boards — tap or swipe in from the right edge"><span>📋</span><b>Boards</b><em id="qbTabBadge" hidden></em></button>

  <aside id="panel" aria-label="Reminders and tasks">
    <div class="panel-head">
      <h2>Reminders &amp; Tasks</h2>
      <button class="icon-btn" id="closePanel" aria-label="Close">✕</button>
    </div>
    <div class="seg" id="filterSeg">
      <button data-f="today">Today</button>
      <button data-f="due" class="on">Scheduled</button>
      <button data-f="open">All open</button>
      <button data-f="done">Done</button>
    </div>
    <div id="reminderList"></div>
    <div class="panel-foot">
      <button class="btn small" id="notifBtn">🔔 Enable notifications</button>
      <p class="fine" id="notifNote"></p>
    </div>
  </aside>
</div>

<div id="banners" aria-live="assertive"></div>

<div id="sheetWrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="sheetTitle">Task</h3>
    <div id="sheetThumb"></div>
    <label>Title<input id="fTitle" placeholder="What needs doing?" autocomplete="off"></label>
    <label>Remind me at<input id="fDue" type="datetime-local"></label>
    <div class="quick" id="quickDue">
      <button data-q="1h">In 1 hour</button><button data-q="tonight">Tonight 6 PM</button><button data-q="tomorrow">Tomorrow 9 AM</button><button data-q="nextweek">Next week</button><button data-q="clear">No date</button>
    </div>
    <label>Repeat<select id="fRepeat"><option value="">Never</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></label>
    <div class="sheet-actions">
      <button class="btn danger" id="fDelete">Delete</button>
      <button class="btn" id="fIcs">📅 Add to Calendar</button>
      <div class="spacer"></div>
      <button class="btn" id="fCancel">Cancel</button>
      <button class="btn primary" id="fSave">Save</button>
    </div>
  </div>
</div>

<div id="actionWrap" hidden><div class="sheet action-sheet"><h3 id="actionTitle"></h3><div id="actionBtns"></div></div></div>
<div id="toast" hidden></div>

<script src="db.js"></script>
<script src="app.js"></script>
<script src="v7.js"></script>
<script src="board.js"></script>
  <script src="assist-engine.js"></script>
  <script src="assistant.js"></script>
  <script src="assistant2.js"></script>
  <script src="lock.js"></script>
  <script src="record.js"></script>
  <script src="audit.js"></script>
  <script src="quotes.js"></script>
  <script src="graph.js"></script>
  <script src="v21.js"></script>
  <script src="inbox.js"></script>
  <script src="v21d.js"></script>
  <script src="v21e.js"></script>
  <script src="v21e2.js"></script>
  <script src="v21e3.js"></script>
  <script src="v21e4.js"></script>
  <script src="v21e5.js"></script>
  <script src="v21e6.js"></script>
  <script src="v21e7.js"></script>
  <script src="v21e8.js"></script>
</body>
</html>
